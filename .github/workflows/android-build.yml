name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        # Flutter 项目位于仓库 app/ 子目录（repo 根目录没有 pubspec.yaml）
        working-directory: app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'   # 项目依赖栈要求 Dart ≥3.10（image_picker ^3.10 / supabase 系 ≥3.9），3.24.3 无法 pub get；3.47.0 为本地全量测试通过的版本
          channel: 'stable'

      - name: Enable Desktop (optional, for clean cache)
        run: flutter config --enable-linux-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build Debug APK
        # 注入连接参数（anon/publishable key 为公开客户端密钥，安全边界在 RLS；
        # 如需覆盖，可在仓库 Variables 中设置 SUPABASE_URL / SUPABASE_ANON_KEY）
        run: |
          flutter build apk --debug \
            --dart-define=SUPABASE_URL=${{ vars.SUPABASE_URL || 'https://kawhasuhnyevrmbollpk.supabase.co' }} \
            --dart-define=SUPABASE_ANON_KEY=${{ vars.SUPABASE_ANON_KEY || 'sb_publishable_ACvP-FoJjPhEftJiAxYfDA_PVoO_9A7' }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
